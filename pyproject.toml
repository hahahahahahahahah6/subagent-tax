[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subagent-tax"
version = "0.2.0"
description = "Estimate how much of your Claude Code bill is subagent preamble resends"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "hao li" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
subagent-tax = "subagent_tax.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/subagent-tax"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
